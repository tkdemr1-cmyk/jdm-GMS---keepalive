name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'   # 매주 월·목 09:00 UTC = 한국시간 18:00
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      # keep_alive 테이블에서 실제로 SELECT 쿼리를 날린다.
      # (root(/rest/v1/)만 두드리면 스펙 문서만 돌아올 뿐, 진짜 DB 쿼리가 아니라서
      #  "활동"으로 인정되지 않을 수 있음 — 반드시 테이블을 조회해야 확실하다)
      - name: Query keep_alive table
        run: |
          curl -sS -o response.json -w "HTTP 상태 코드: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
          echo "응답 내용:"
          cat response.json
