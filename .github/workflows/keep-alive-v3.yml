name: Supabase Keep Alive (GitHub)

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query keep_alive table
        run: |
          curl -sS -o response.json -w "HTTP 상태 코드: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
          echo "응답 내용:"
          cat response.json

      - name: Repository keep-alive commit
        uses: efrecon/gh-action-keepalive@main
        with:
          timeout: 3542400   # 41일 (초 단위) — 이 기간 내에 사람 커밋이 없을 때만 대신 커밋
